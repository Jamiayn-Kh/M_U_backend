spring.datasource.url=jdbc:h2:mem:mungun_urlal_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=mungun_urlal

spring.flyway.enabled=true
spring.flyway.default-schema=mungun_urlal
spring.flyway.schemas=mungun_urlal

app.jwt.secret=test-only-secret-value-that-must-never-be-used-in-production
app.jwt.expiration=3600000
app.cors.allowed-origins=http://localhost:3000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
