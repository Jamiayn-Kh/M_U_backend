spring.datasource.url=jdbc:postgresql://localhost:5432/mungun_urlal
spring.datasource.username=postgres
spring.datasource.password=root

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Logging
logging.level.org.flywaydb=DEBUG

app.jwt.secret=your-super-secret-jwt-key-change-this-in-production
app.jwt.expiration=86400000

server.port=8080
app.cors.allowed-origins=http://localhost:3000

app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:System Admin}