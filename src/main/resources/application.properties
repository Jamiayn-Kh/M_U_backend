spring.datasource.url=jdbc:postgresql://localhost:5432/mungun_urlal
spring.datasource.username=postgres
spring.datasource.password=root

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Logging
logging.level.org.flywaydb=DEBUG

# JWT
app.jwt.secret=${JWT_SECRET:mungun-urlal-default-jwt-secret-key-for-development-only}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=8080

# CORS
app.cors.allowed-origins=http://localhost:3000

# Initial admin
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:System Admin}
logging.level.org.springframework.security=DEBUG